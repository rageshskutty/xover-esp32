name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/check.py

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Configure CMake
        run: cmake -S host -B host/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build host/build
      - name: Run tests
        run: ctest --test-dir host/build --output-on-failure
      - name: Compare compiled C response with SciPy
        run: python tools/test_scipy_compare.py --library host/build/libdspblocks_eval.so
      - name: Test independent protection oracle
        run: python tools/test_protection_oracle.py

  host-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure CMake (ASan + UBSan)
        run: cmake -S host -B host/build-san -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build host/build-san
      - name: Run tests
        run: ctest --test-dir host/build-san --output-on-failure

  host-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure CMake (coverage)
        run: >
          cmake -S host -B host/build-cov -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="--coverage -O0"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build host/build-cov
      - name: Run tests
        run: ctest --test-dir host/build-cov --output-on-failure
      - name: G2 gate, dspblocks line coverage >= 90 %
        run: python tools/coverage_gate.py host/build-cov

  target-build:
    name: target-build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        mode: [none, pinwalk, pinwalk-mute, i2cscan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build firmware for ESP32-S3 with -Werror
        shell: bash
        working-directory: firmware
        env:
          MODE: ${{ matrix.mode }}
        run: |
          . "$IDF_PATH/export.sh"
          case "$MODE" in
            none) overrides="" ;;
            pinwalk) overrides="CONFIG_XOVER_BRINGUP_MODE_PINWALK=y" ;;
            pinwalk-mute) overrides=$'CONFIG_XOVER_BRINGUP_MODE_PINWALK=y\nCONFIG_XOVER_BRINGUP_PINWALK_MUTE=y' ;;
            i2cscan) overrides="CONFIG_XOVER_BRINGUP_MODE_I2CSCAN=y" ;;
            *) echo "unknown mode $MODE"; exit 1 ;;
          esac
          mkdir -p "build/$MODE"
          printf '%s\n' "$overrides" > "build/$MODE/mode.defaults"
          idf.py -B "build/$MODE" \
            -DIDF_TARGET=esp32s3 \
            -DSDKCONFIG="$PWD/build/$MODE/sdkconfig" \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;$PWD/build/$MODE/mode.defaults" \
            -DXOVER_WERROR=ON \
            build
</content>
